<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Animations */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); display: none; }
        }
        
        .view-section { display: none; opacity: 0; }
        .view-section.active { 
            display: block; 
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        .view-section.hiding {
            animation: fadeOut 0.4s ease forwards;
        }

        /* Stat Card Hover Effect */
        .stat-card {
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            background-color: rgba(31, 41, 55, 0.8);
            border-color: rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-black text-gray-100 min-h-screen font-sans antialiased flex items-center justify-center p-4 selection:bg-rose-500 selection:text-white">

    <!-- Background Glow Effects for Admin Vibe -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-rose-600/10 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-600/10 rounded-full blur-[100px]"></div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="w-full max-w-4xl">
        
        <!-- 🔒 LOGIN VIEW -->
        <div id="login-container" class="view-section active max-w-md mx-auto bg-gray-800/40 backdrop-blur-xl p-8 rounded-3xl shadow-[0_0_40px_rgba(225,29,72,0.1)] border border-gray-700/50">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-rose-500/20 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                </div>
                <h2 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-red-500">System Access</h2>
                <p class="text-sm text-gray-400 mt-1">Authorized personnel only</p>
            </div>

            <div class="space-y-5">
                <div class="group">
                    <input type="password" id="adminPass" placeholder="Enter Secure Passcode" class="w-full p-4 bg-gray-900/60 border border-gray-700 rounded-xl focus:ring-2 focus:ring-rose-500/50 focus:border-rose-500 outline-none text-white transition-all duration-300 tracking-widest text-center placeholder:tracking-normal placeholder-gray-600" onkeypress="handleEnter(event)">
                </div>
                <p id="loginError" class="text-rose-400 text-sm text-center hidden opacity-0 transition-opacity duration-300">Invalid passcode. Try again.</p>
                <button onclick="login()" id="loginBtn" class="w-full bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-bold py-4 rounded-xl transition-all duration-300 shadow-[0_10px_20px_-10px_rgba(225,29,72,0.5)] hover:-translate-y-1 active:translate-y-0 flex justify-center items-center">
                    <span id="loginText">Authenticate</span>
                    <svg id="loginLoader" class="animate-spin h-5 w-5 ml-2 hidden text-white" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </div>
        </div>

        <!-- 📊 DASHBOARD VIEW -->
        <div id="dashboard-container" class="view-section bg-gray-800/40 backdrop-blur-xl p-8 rounded-3xl shadow-[0_0_50px_rgba(79,70,229,0.1)] border border-gray-700/50">
            <!-- Header -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-gray-700/50 pb-6 gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Nova Analytics</h2>
                    <p class="text-sm text-gray-400">Live system overview</p>
                </div>
                <button onclick="logout()" class="px-5 py-2.5 bg-gray-900/80 hover:bg-rose-600/20 text-gray-300 hover:text-rose-400 border border-gray-700 hover:border-rose-500/50 rounded-xl transition-all duration-300 flex items-center text-sm font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    Terminate Session
                </button>
            </div>
            
            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Stat 1 -->
                <div class="stat-card bg-gray-900/40 p-6 rounded-2xl border border-gray-700/50 flex flex-col items-center justify-center relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 w-16 h-16 bg-blue-500/10 rounded-full blur-xl"></div>
                    <p class="text-sm text-gray-400 font-medium mb-1">Total Bots Generated</p>
                    <div class="flex items-end space-x-2">
                        <p id="stat-bots" class="text-4xl font-extrabold text-white">--</p>
                        <span class="text-xs text-emerald-400 mb-1 flex items-center">
                            <svg class="w-3 h-3 mr-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg> Today
                        </span>
                    </div>
                </div>

                <!-- Stat 2 -->
                <div class="stat-card bg-gray-900/40 p-6 rounded-2xl border border-gray-700/50 flex flex-col items-center justify-center relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 w-16 h-16 bg-purple-500/10 rounded-full blur-xl"></div>
                    <p class="text-sm text-gray-400 font-medium mb-1">Active Users</p>
                    <p id="stat-users" class="text-4xl font-extrabold text-white">--</p>
                </div>

                <!-- Stat 3 -->
                <div class="stat-card bg-gray-900/40 p-6 rounded-2xl border border-indigo-500/30 flex flex-col items-center justify-center relative overflow-hidden shadow-[inset_0_0_20px_rgba(99,102,241,0.05)]">
                    <div class="absolute -right-4 -top-4 w-16 h-16 bg-emerald-500/10 rounded-full blur-xl"></div>
                    <p class="text-sm text-gray-400 font-medium mb-1">Engine Status</p>
                    <div class="flex items-center space-x-2">
                        <span class="relative flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                        <p id="stat-api" class="text-xl font-bold text-emerald-400 tracking-wide">Connecting...</p>
                    </div>
                </div>
            </div>
            
            <!-- Future Graph/Logs Placeholder -->
            <div class="mt-8 bg-gray-900/40 border border-gray-700/50 rounded-2xl p-6 h-32 flex items-center justify-center border-dashed">
                <p class="text-gray-500 text-sm">Traffic Visualization Engine (Coming Soon)</p>
            </div>
        </div>

    </div>

    <script>
        // Enter key to submit login
        function handleEnter(e) {
            if(e.key === 'Enter') login();
        }

        // Check active session
        window.onload = () => {
            if(localStorage.getItem('adminToken')) {
                transitionToDashboard();
            }
        };

        async function login() {
            const passInput = document.getElementById('adminPass');
            const btn = document.getElementById('loginBtn');
            const text = document.getElementById('loginText');
            const loader = document.getElementById('loginLoader');
            const errorMsg = document.getElementById('loginError');
            
            if(!passInput.value) return;

            // UI Loading state
            text.innerText = "Verifying...";
            loader.classList.remove('hidden');
            btn.disabled = true;
            errorMsg.classList.add('hidden', 'opacity-0');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passInput.value })
                });
                const data = await res.json();
                
                if(data.success) {
                    localStorage.setItem('adminToken', data.token);
                    transitionToDashboard();
                } else {
                    // Show error gracefully
                    passInput.classList.add('border-rose-500', 'ring-2', 'ring-rose-500/50');
                    errorMsg.classList.remove('hidden');
                    setTimeout(() => errorMsg.classList.remove('opacity-0'), 10);
                    
                    setTimeout(() => {
                        passInput.classList.remove('border-rose-500', 'ring-2', 'ring-rose-500/50');
                    }, 2000);
                }
            } catch (err) {
                errorMsg.innerText = "Server connection failed.";
                errorMsg.classList.remove('hidden');
                setTimeout(() => errorMsg.classList.remove('opacity-0'), 10);
            } finally {
                // Reset UI
                text.innerText = "Authenticate";
                loader.classList.add('hidden');
                btn.disabled = false;
                passInput.value = '';
            }
        }

        function transitionToDashboard() {
            const loginView = document.getElementById('login-container');
            const dashView = document.getElementById('dashboard-container');
            
            // Fade out login
            loginView.classList.remove('active');
            loginView.classList.add('hiding');
            
            setTimeout(() => {
                loginView.style.display = 'none';
                loginView.classList.remove('hiding');
                
                // Fetch stats before showing dashboard
                fetchStats();
                
                // Show dashboard
                dashView.classList.add('active');
            }, 400); // Wait for fade out animation
        }

        async function fetchStats() {
            const token = localStorage.getItem('adminToken');
            try {
                const res = await fetch('/api/admin/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if(res.ok) {
                    // Animate numbers (simple implementation)
                    document.getElementById('stat-bots').innerText = data.botsGeneratedToday;
                    document.getElementById('stat-users').innerText = data.activeUsers;
                    document.getElementById('stat-api').innerText = data.currentAPI;
                } else {
                    logout(); // Token invalid/expired
                }
            } catch(e) {
                document.getElementById('stat-api').innerText = "Offline";
                document.getElementById('stat-api').classList.replace('text-emerald-400', 'text-rose-400');
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            const dashView = document.getElementById('dashboard-container');
            const loginView = document.getElementById('login-container');
            
            dashView.classList.remove('active');
            dashView.classList.add('hiding');
            
            setTimeout(() => {
                dashView.style.display = 'none';
                dashView.classList.remove('hiding');
                
                loginView.style.display = 'block';
                setTimeout(() => loginView.classList.add('active'), 50);
            }, 400);
        }
    </script>
</body>
</html>
